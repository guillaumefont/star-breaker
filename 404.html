<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Breaker</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #05040d; color: #f4f2ff; font: 16px/1.5 system-ui, sans-serif; text-align: center; }
  main { max-width: 26rem; padding: 0 16px; }
  a { color: #3ff0e0; }
</style>
</head>
<body>
<main>
  <h1>Star Breaker</h1>
  <p id="msg">This page doesn't exist.</p>
  <p><a id="go" href="./">Go to the latest build</a></p>
</main>
<script>
// GitHub Pages serves this page for every missing path. PR previews (/pr/N/...) are
// deleted when the PR is merged or closed, so an old preview link (web or APK) is sent
// to the same file in the latest main build instead of a dead end.
(function () {
  var p = location.pathname;
  var i = p.indexOf("/pr/");
  var base = i >= 0 ? p.slice(0, i + 1) : p.replace(/[^/]*$/, "");
  var rest = i >= 0 ? p.slice(i + 4).replace(/^[^/]*\/?/, "") : "";
  var target = base + (rest === "star-breaker.apk" ? rest : "");
  document.getElementById("go").href = target;
  if (i >= 0) {
    document.getElementById("msg").textContent =
      "This preview was removed when its pull request was merged or closed. Opening the latest build instead…";
    setTimeout(function () { location.replace(target); }, 1500);
  }
})();
</script>
</body>
</html>
