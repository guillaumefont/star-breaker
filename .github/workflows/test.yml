name: Headless test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
      - name: Import project
        run: ./godot --headless --path . --import
      - name: Full run (stage, pod, charge beam, Bloom Mother, loop, game over)
        run: ./godot --headless --path . --script tests/play_test.gd
      - name: Songs build on the main thread (Android start-up crash)
        run: ./godot --headless --path . --script tests/audio_test.gd
      - name: Touch zones and floating stick
        run: ./godot --headless --path . --script tests/touch_test.gd
      - name: Crash report, safe graphics and screen fill
        run: ./godot --headless --path . --script tests/screen_test.gd
      - name: Self-update (game pack download, checks, APK offer)
        run: ./godot --headless --path . --script tests/update_test.gd
